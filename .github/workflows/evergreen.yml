name: Evergreen

on:
  schedule:
    # Every 9AM on Monday KST
    - cron: '0 0 * * 1'

  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Run before `bun i` so taze sees no node_modules yet and also bumps .nvmrc
      - run: bunx taze latest -wl
      - run: bun i

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.EVERGREEN_TOKEN }}
          title: Bump dependencies
          delete-branch: true
